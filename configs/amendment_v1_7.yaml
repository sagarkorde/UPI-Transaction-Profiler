# Protocol amendment v1.7 (2026-11-09): PRE-REGISTERED CONFIRMATORY REPLICATION OF DRT-IDF ON FRESH
# TABFORMER DATA, CORRECTING THE INFEASIBLE WINDOW OF AMENDMENT v1.6.
#
# This file, scripts/confirm_v1_7.py and the loader code they use were committed and pushed to the public
# repository BEFORE any model was fitted or evaluated on the window below. protocol.yaml (v1.0) and
# amendments v1.1-v1.6 are unchanged and are applied without modification: no policy, feature list,
# hyper-parameter, budget, rho or statistical procedure is changed.
#
# Why: amendment v1.6 registered TabFormer 2011-01..2014-10. Its first run showed that the test period
# (about 2014-05..2014-10) contains no labelled fraud, so H1, H2 and H5 of v1.6 are untestable; they are
# reported as such. TabFormer's pre-2015 fraud labels occur in bursts: none in 2011-02..2011-12,
# 2012-09..2013-01, 2013-04..2013-06 or 2014-05..2014-12. Protocol v1.0 ends its window at the last month
# with fraud labels (2019-10). v1.7 applies the same rule before 2015: it keeps v1.6's start, warm-up and
# every other setting and ends the window at the last pre-2015 month with fraud labels, 2014-04.
#
# Inspected before this file was written, and nothing else:
#   - monthly row counts and fraud counts per card channel ("Use Chip") for 2004-2014, committed as
#     results/feasibility/tabformer_monthly_counts_2004_2014.csv (no pre-2015 fraud is a chip transaction);
#   - for this window, daily fraud counts per approximate split and channel (chronological 55/15/15/15 by
#     rows at day boundaries): train 2011-01-01..2012-11-11, 1,388 frauds (online 1,045, swipe 343);
#     tune ..2013-05-11, 96 (46, 50); calib ..2013-11-04, 1,352 (1,180, 172); test 2013-11-05..2014-04-30,
#     1,622 (online 1,373, swipe 249);
#   - from the v1.6 TabFormer runs: the run log and per-split row/fraud counts of the first run (test frauds 0).
# The v1.6 TabFormer runs used about 2013-06..2014-02 of this window as their tune and calibration periods.
# None of their scores, calibration statistics, combiner weights or policy outputs was inspected, and none
# is used here.

amendment_version: "1.7"

replications:
  tabformer_e14:
    inherits: tabformer            # every dataset-keyed setting of v1.0-v1.5 (daily windows, negative
                                   # sampling 0.2, held-out rule "channel", identity/identifier feature lists)
    warmup_years: [2010]           # history only, for behavioural features (as v1.6)
    years: [2011, 2014]            # inclusive (as v1.6)
    last_month: "2014-04"          # last pre-2015 month with fraud labels (v1.6: 2014-10; v1.0: 2019-10)
    time_origin: "2010-01-01"      # (as v1.6)
    # Disjoint from every row used under v1.0-v1.5 (2015-01-01 .. 2019-10-31). Expected held-out groups:
    # Online and Swipe (each with >= 10 test frauds by the counts above); the pipeline's rule decides.

# Everything else as in v1.0-v1.6: seeds 0-4, 55/15/15/15 chronological splits, >= 10 test frauds per
# held-out group, budgets c in {0.5, 1, 2, 4}, rho = 0.1, every policy.

confirmatory:
  budget_multiplier: 1.0
  endpoint: >-
    held-out recall at c = 1, pooled over every qualifying held-out channel (seed-averaged per-window
    counts summed across held-out scenarios, exactly as in scripts/analyze.py and amendment v1.6).
  hypotheses:
    H6: {replication: tabformer_e14, policy: DRT-IDF, reference: SUP, statement: "DRT-IDF > SUP"}
    H7: {replication: tabformer_e14, policy: DRT-IDF, reference: DRT, statement: "DRT-IDF > DRT (IF reserve)"}
  test: >-
    paired window statistics of v1.0 (src/dstriage/stats.py: paired_stats): two-sided sign-flip
    permutation over windows, 10,000 resamples; 95% window-bootstrap CI, 2,000 resamples.
  multiplicity: holm over H6-H7 (a new family; the v1.6 family is unchanged and reported separately)
  alpha: 0.05
  success: "a hypothesis is supported iff the difference is positive and its Holm-adjusted p < 0.05"
  H8_stationary_cost:
    replication: tabformer_e14
    statement: >-
      DRT-IDF's relative stationary recall cost, 1 - recall(DRT-IDF) / recall(SUP) in the base scenario
      at c = 1, is at most rho = 0.10.
    criterion: "supported iff the one-sided 95% window-bootstrap upper bound (95th percentile) is <= 0.10"
    resamples: 2000
  rng_seed: [20261109, 1701]
  infeasibility: >-
    If no held-out channel has >= 10 test frauds, H6 and H7 are untestable; if the base test period has
    no fraud, H8 is untestable. No claim is made for an untestable hypothesis.
  execution: >-
    Runs are produced once, from a fresh clone of the registration commit, into
    results/replication_v1_7/runs, and analysed only by scripts/confirm_v1_7.py. If a defect forces a code
    change after registration, the original output is kept, both outputs are reported, and the affected
    hypotheses are labelled exploratory.
  reporting: >-
    The outcomes of H6-H8, and of v1.6's H1-H5 including the infeasible ones, are reported in the paper's
    abstract and results whatever they are, together with the reason for this amendment.
  secondary_descriptive:
    - "DRT vs SUP (the v1.0 primary hypothesis) on this window"
    - "all policies at all budgets; per-channel held-out recall; time to first detection"
